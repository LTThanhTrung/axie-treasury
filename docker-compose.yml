services:
  web:
    build: .
    image: web:latest
    container_name: axie_treasury_web
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=pg_microservice_db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-axie_treasury}
      - DB_USER=${DB_USER:-owner_axie_treasury}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://${DB_USER:-owner_axie_treasury}:${DB_PASSWORD}@pg_microservice_db:5432/${DB_NAME:-axie_treasury}?schema=public
      - SSH_HOST=
    networks:
      - database_net
      - nginx_net

  nginx:
    image: nginx:alpine
    container_name: nginx-axietreasury
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "8080:81"
    depends_on:
      - web
    restart: always
    networks:
      - nginx_net

networks:
  database_net:
    name: postgres_db_backend_network
    external: true
  nginx_net:
    name: sharednet
    external: true
